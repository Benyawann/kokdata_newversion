<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>รายการสถานีตรวจสอบ</title>
    <link rel="stylesheet" href="/static/css/style1.css">
</head>
<body>
    <div class="container">
        <h1>รายการสถานีตรวจสอบ</h1>
        <a href="/add-station.html" class="btn-add">+ เพิ่มสถานีใหม่</a>
        
        <!-- พื้นที่แสดงรายการสถานี -->
        <div id="stationList" style="margin-top: 20px;">
            <p>กำลังโหลดข้อมูล...</p>
        </div>
    </div>

    <script>
    // โหลดข้อมูลจาก API เมื่อเปิดหน้า
    document.addEventListener('DOMContentLoaded', async () => {
        const stationList = document.getElementById('stationList');
        
        try {
            const res = await fetch('/api/stations'); // เรียก API เพื่อดึงข้อมูลทั้งหมด
            const result = await res.json();
            
            if (result.success && result.data.length > 0) {
                let html = '<div class="station-grid">';
                result.data.forEach(st => {
                    html += `
                        <div class="station-card">
                            <h3>${st.station}</h3>
                            <p>แม่น้ำ: ${st.river}</p>
                            <p>จังหวัด: ${st.province}</p>
                            <a href="/station-detail.html?id=${st.id}" class="btn-view">ดูรายละเอียด</a>
                        </div>
                    `;
                });
                html += '</div>';
                stationList.innerHTML = html;
            } else {
                stationList.innerHTML = '<p>ยังไม่มีข้อมูลสถานี</p>';
            }
        } catch (error) {
            stationList.innerHTML = '<p style="color:red">เกิดข้อผิดพลาดในการโหลดข้อมูล</p>';
        }
    });
    </script>
</body>
</html>
