name: Keep Supabase Awake

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase with Heartbeat
        run: |
          echo "🔍 Keeping Supabase awake..."
          
          # 1. สร้างตาราง heartbeat ถ้ายังไม่มี
          curl -s -X POST \
            "https://oaemdjvtphyrrfdxizzm.supabase.co/rest/v1/rpc/create_heartbeat_table" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}' || true
          
          # 2. อัปเดต timestamp ในตาราง heartbeat
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            "https://oaemdjvtphyrrfdxizzm.supabase.co/rest/v1/heartbeat" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"last_ping": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'", "status": "awake"}')
          
          echo "📊 HTTP Response: $RESPONSE"
          
          if [ "$RESPONSE" = "200" ] || [ "$RESPONSE" = "201" ]; then
            echo "✅ Success! Supabase is awake!"
          else
            echo "⚠️ Response: $RESPONSE"
          fi
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}