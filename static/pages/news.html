<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ข่าวสาร</title>
    <link rel="icon" type="image/x-icon" href="/static/image/favicon.ico">
    <link rel="stylesheet" href="/static/css/news.css">
    
</head>
<body>
   <div class="container">
    <!-- Back Button -->
    <a href="/" class="back-button" id="back-button">ย้อนกลับ</a>
    
    <!-- Header -->
    <div class="news-header" style="text-align: center; margin-bottom: 10px;">
        <h1>ข่าวสาร</h1>
        
        <!-- Search Box -->
        <div class="search-box">
            <input type="text" id="search-input" placeholder="ค้นหา... 🔍">
        </div>
    </div>

    <!-- News Grid -->
    <div class="news-grid" id="news-grid"></div>
    
    <!-- Empty State -->
    <div class="empty-state" id="empty-state" style="display: none;">
        <div class="empty-state-icon">📭</div>
        <p>ยังไม่มีข่าวสาร</p>
    </div>
</div>

<!-- News Detail Modal -->
<div class="modal-overlay" id="newsModal">
    <div class="news-modal">
        <div class="modal-header">
            <div>
                <span class="modal-badge" id="modalBadge">ทั่วไป</span>
                <h2 class="modal-title" id="modalTitle">หัวข้อข่าว</h2>
                <div class="modal-meta">
                    <span id="modalSource">🏢 แหล่งที่มา</span>
                </div>
            </div>
            <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body" id="modalContent"></div>
    </div>
</div>

<script>
// ===== ตัวแปร =====
let newsData = [];
let isLoading = true;
let loadError = false;
let currentPage = 1;
let searchQuery = '';
const ITEMS_PER_PAGE = 6;

// ===== DOM Elements =====
const newsGrid = document.getElementById('news-grid');
const emptyState = document.getElementById('empty-state');
const searchInput = document.getElementById('search-input');
const newsModal = document.getElementById('newsModal');
const modalClose = document.getElementById('modalClose');
const modalBadge = document.getElementById('modalBadge');
const modalTitle = document.getElementById('modalTitle');
const modalSource = document.getElementById('modalSource');
const modalContent = document.getElementById('modalContent');

// ===== ดึงข่าวจาก API =====
async function fetchNewsFromAPI() {
    try {
        isLoading = true;
        currentPage = 1;
        searchQuery = '';
        if (searchInput) searchInput.value = '';
        showLoadingState();
        
        const response = await fetch('/api/ryt9-news');
        const result = await response.json();
        
        if (result.success && result.data) {
            newsData = result.data;
            loadError = false;
        } else {
            loadError = true;
            console.error('API Error:', result.error);
        }
    } catch (error) {
        loadError = true;
        console.error('Fetch Error:', error);
    } finally {
        isLoading = false;
        renderNews();
    }
}

// ===== ฟังก์ชันกรองข่าวตามคำค้นหา =====
function filterNewsBySearch(newsList, query) {
    if (!query || query.trim() === '') return newsList;
    
    const lowerQuery = query.toLowerCase().trim();
    
    return newsList.filter(news => {
        const title = (news.title || '').toLowerCase();
        const excerpt = (news.excerpt || '').toLowerCase();
        const content = (news.content || '').toLowerCase();
        const source = (news.source || '').toLowerCase();
        
        return title.includes(lowerQuery) || 
               excerpt.includes(lowerQuery) || 
               content.includes(lowerQuery) ||
               source.includes(lowerQuery);
    });
}

// ===== ไฮไลต์คำค้นหา =====
function highlightText(text, query) {
    if (!query || !text) return text;
    const escapedQuery = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = new RegExp(`(${escapedQuery})`, 'gi');
    return text.replace(regex, '<span class="search-highlight">$1</span>');
}

// ===== ล้างการค้นหา =====
function clearSearch() {
    searchQuery = '';
    if (searchInput) searchInput.value = '';
    currentPage = 1;
    renderNews();
}

// ===== Render News Cards =====
function renderNews() {
    if (isLoading) { showLoadingState(); return; }
    if (loadError && newsData.length === 0) { showErrorState(); return; }
    
    const filteredNews = filterNewsBySearch(newsData, searchQuery);
    
    if (filteredNews.length === 0) {
        newsGrid.style.display = 'none';
        emptyState.style.display = 'block';
        
        if (searchQuery) {
            emptyState.innerHTML = `
                <div class="empty-state-icon">🔍</div>
                <p>ไม่พบข่าวที่ตรงกับ "<strong>${searchQuery}</strong>"</p>
                <button onclick="clearSearch()" 
                        style="margin-top: 15px; padding: 8px 20px; 
                               background: #6c757d; color: white; 
                               border: none; border-radius: 6px; 
                               cursor: pointer;">
                    ล้างการค้นหา
                </button>
            `;
        } else {
            emptyState.innerHTML = `
                <div class="empty-state-icon">📭</div>
                <p>ยังไม่มีข่าวสาร</p>
            `;
        }
        return;
    }
    
    // Pagination
    const totalPages = Math.ceil(filteredNews.length / ITEMS_PER_PAGE);
    const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
    const pageItems = filteredNews.slice(startIndex, startIndex + ITEMS_PER_PAGE);
    
    newsGrid.style.display = 'grid';
    emptyState.style.display = 'none';
    
    // Render Cards
    newsGrid.innerHTML = pageItems.map(news => `
        <div class="news-card ${news.type}" onclick="openNewsLink('${news.externalLink}')">
            <div class="news-image">
                ${news.image ? `
                    <img src="${news.image}" alt="news" 
                         onerror="this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-size:48px;color:white;\\'>📰</div>'">
                ` : '<div style=\'display:flex;align-items:center;justify-content:center;height:100%;font-size:48px;color:white;\'>📰</div>'}
            </div>
            <div class="news-content">
                <span></span>
                <div class="news-title">${highlightText(news.title, searchQuery)}</div>
                <div class="news-excerpt">${highlightText(news.excerpt, searchQuery)}</div>
                <div class="news-meta">
                    <span></span>
                    <span class="news-read">อ่านเพิ่มเติม</span>
                </div>
            </div>
        </div>
    `).join('');
    
    renderPagination(totalPages);
}

// ===== Render Pagination =====
function renderPagination(totalPages) {
    const old = document.getElementById('pagination');
    if (old) old.remove();
    if (totalPages <= 1) return;
    
    const pagination = document.createElement('div');
    pagination.id = 'pagination';
    pagination.className = 'pagination';
    
    pagination.innerHTML = `
        <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}><</button>
        ${Array.from({length: totalPages}, (_, i) => 
            `<button onclick="changePage(${i + 1})" class="${i + 1 === currentPage ? 'active' : ''}">${i + 1}</button>`
        ).join('')}
        <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>></button>
    `;
    
    newsGrid.parentNode.insertBefore(pagination, newsGrid.nextSibling);
}

// ===== เปลี่ยนหน้า =====
function changePage(page) {
    const filtered = filterNewsBySearch(newsData, searchQuery);
    const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
    if (page < 1 || page > totalPages) return;
    
    currentPage = page;
    renderNews();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ===== เปิดลิงก์ข่าว =====
function openNewsLink(url) {
    if (url) window.open(url, '_blank', 'noopener,noreferrer');
}

// ===== Modal =====
function closeNewsModal() {
    newsModal.classList.remove('active');
    document.body.style.overflow = '';
}

// ===== States =====
function showLoadingState() {
    newsGrid.style.display = 'none';
    emptyState.style.display = 'block';
    emptyState.innerHTML = `<div class="empty-state-icon">⏳</div><p>กำลังโหลด...</p>`;
}

function showErrorState() {
    newsGrid.style.display = 'none';
    emptyState.style.display = 'block';
    emptyState.innerHTML = `
        <div class="empty-state-icon">❌</div>
        <p>ไม่สามารถดึงข่าวสารได้</p>
        <button onclick="fetchNewsFromAPI()" 
                style="margin-top: 15px; padding: 10px 20px; 
                       background: #1a73e8; color: white; 
                       border: none; border-radius: 6px; cursor: pointer;">
            🔄 ลองใหม่
        </button>
    `;
}

// ===== Initialize =====
document.addEventListener('DOMContentLoaded', () => {
    fetchNewsFromAPI();
    
    // Search events
    if (searchInput) {
        searchInput.addEventListener('input', (e) => {
            searchQuery = e.target.value;
            currentPage = 1;
            renderNews();
        });
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') searchInput.blur();
        });
    }
    
    // Modal events
    modalClose.addEventListener('click', closeNewsModal);
    newsModal.addEventListener('click', (e) => { if (e.target === newsModal) closeNewsModal(); });
    document.addEventListener('keydown', (e) => { 
        if (e.key === 'Escape' && newsModal.classList.contains('active')) closeNewsModal(); 
    });
});
</script>
</body>
</html>
